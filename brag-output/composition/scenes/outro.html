<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Outro — Smart Home Harmony Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.4/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; }
      body { background: #f3f4f6; color: #1f2937; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f3f4f6; }
      .clip { position: absolute; inset: 0; display: grid; place-items: center; }
      .outro-content { text-align: center; }
      .outro-main { opacity: 0; font-size: 48px; font-weight: 800; color: #111827; letter-spacing: -0.02em; transform: translateY(20px); }
      .outro-sub { opacity: 0; font-size: 20px; color: #4b5563; margin-top: 12px; transform: translateY(20px); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="outro" data-width="1920" data-height="1080" data-duration="4">
      <div id="outro" class="clip" data-start="0" data-duration="4">
        <div class="outro-content">
          <h1 id="outro-main" class="outro-main">Smart Home Harmony Engine</h1>
          <p id="outro-sub" class="outro-sub">Fuzzy-logic energy estimates. All in the browser.</p>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#outro-main", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.to("#outro-sub", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.8);
      tl.to("#outro-main", { opacity: 0, duration: 0.4 }, 3.4);
      tl.to("#outro-sub", { opacity: 0, duration: 0.4 }, 3.6);
      window.__timelines["outro"] = tl;
    </script>
  </body>
</html>
