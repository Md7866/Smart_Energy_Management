<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hook — Smart Home Harmony Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.4/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; }
      body { background: #000000; color: #ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000000; }
      .clip { position: absolute; inset: 0; display: grid; place-items: center; }
      .hook-content { text-align: center; }
      .hook-line {
        opacity: 0;
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
        transform: translateY(20px);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hook" data-width="1920" data-height="1080" data-duration="3">
      <div id="hook" class="clip" data-start="0" data-duration="3">
        <div class="hook-content">
          <h1 id="hook-line1" class="hook-line">Your home is wasting energy.</h1>
          <h1 id="hook-line2" class="hook-line">You just can't see it.</h1>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#hook-line1", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
      tl.to("#hook-line1", { opacity: 0, duration: 0.4 }, 1.7);
      tl.to("#hook-line2", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.9);
      tl.to("#hook-line2", { opacity: 0, duration: 0.4 }, 2.8);
      window.__timelines["hook"] = tl;
    </script>
  </body>
</html>
